[package]
name = "chessie"
version = "0.1.0"
edition = "2021"

[dependencies]
# jpeg: the chess set model ships JPEG textures, which Bevy does not decode
# by default.
bevy = { version = "0.19", features = ["jpeg"] }
shakmaty = "0.30"

# A shipped build: one binary, no debug symbols, whole-program optimisation.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
# Line numbers in panics and test failures, without the full DWARF tables.
# The complete debug info for this dependency tree runs to gigabytes.
debug = "line-tables-only"

# Dependencies are built optimised, and without debug info: Bevy is some three
# hundred crates and we never step into any of them. Keeping their symbols was
# most of a 13 GB target directory.
[profile.dev.package."*"]
opt-level = 3
debug = false

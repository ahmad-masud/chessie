name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Bevy needs a windowing stack and audio on Linux, none of which is on
    # the runner by default. Both display backends are covered: the build
    # pulls in wayland-sys and the X11 crates regardless of which one a
    # machine would actually use.
    - name: Install Bevy's system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libudev-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libx11-dev \
          libxcursor-dev \
          libxi-dev \
          libxrandr-dev

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --verbose

    # The tests that need a real engine detect its absence and skip, so this
    # passes on a runner with no Stockfish installed.
    - name: Run tests
      run: cargo test --verbose
